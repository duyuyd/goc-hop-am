name: Guardian - OpenSSF supply chain scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
  checks: read
jobs:
  scorecard:
    name: OpenSSF Scorecard (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-ossf-scorecard
          path: scorecard-results.sarif
          retention-days: 7
          if-no-files-found: warn
