name: Pre-merge integration test round 2 (temporary)
on:
  push:
    branches:
      - security/alerts-triage-2026-11-10
    paths:
      - .github/workflows/security-merge-check.yml
permissions:
  contents: read
jobs:
  combined-web-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main only in CI checkout
        run: |
          git fetch origin main
          git -c user.name=CI -c user.email=ci@example.invalid merge --no-commit --no-ff origin/main
          git status --short
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install merged lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify merged dependencies have no advisories
        run: npm audit --audit-level=low
      - name: Generate shared mobile UI and lint
        run: |
          node mobile/scripts/prepare-web.mjs
          npm run lint
      - name: Test all current repository suites
        run: node --test tests/*.test.mjs
      - name: Build merged website
        run: npm run build
      - name: Compile merged Android app
        run: gradle -p mobile/android :app:assembleDebug --no-daemon
  combined-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main only in CI checkout
        run: |
          git fetch origin main
          git -c user.name=CI -c user.email=ci@example.invalid merge --no-commit --no-ff origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate shared mobile UI
        run: node mobile/scripts/prepare-web.mjs
      - name: Compile iOS Simulator without signing or publication
        run: xcodebuild -project mobile/ios/GocHopAm.xcodeproj -scheme GocHopAm -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath mobile/build/security-merge CODE_SIGNING_ALLOWED=NO build
