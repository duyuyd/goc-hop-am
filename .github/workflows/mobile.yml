name: Build Android and iOS
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared UI
        run: |
          node mobile/scripts/prepare-web.mjs
          node --check public/mobile/bundle.js
          npm test
      - name: Build iOS Simulator
        run: |
          xcodebuild -project mobile/ios/GocHopAm.xcodeproj -scheme GocHopAm -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath mobile/build/ios-simulator CODE_SIGNING_ALLOWED=NO build
          mkdir -p mobile/build/release
          ditto -c -k --sequesterRsrc --keepParent mobile/build/ios-simulator/Build/Products/Debug-iphonesimulator/GocHopAm.app mobile/build/release/Goc_Hop_Am_iOS_Simulator.zip
      - name: Build iOS device without signing
        run: |
          xcodebuild -project mobile/ios/GocHopAm.xcodeproj -scheme GocHopAm -configuration Release -destination 'generic/platform=iOS' -derivedDataPath mobile/build/ios-device CODE_SIGNING_ALLOWED=NO build
          mkdir -p mobile/build/Payload
          cp -R mobile/build/ios-device/Build/Products/Release-iphoneos/GocHopAm.app mobile/build/Payload/
          cd mobile/build
          zip -qry release/Goc_Hop_Am_iOS_Chua_Ky.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-and-simulator
          path: mobile/build/release/*
          retention-days: 14
      - name: Attach iOS files to public release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" mobile/build/release/* --clobber
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned Android App Bundle
        run: |
          node mobile/scripts/prepare-web.mjs
          gradle -p mobile/android :app:assembleDebug :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
      - name: Verify standalone QA APK archive
        run: |
          test -s mobile/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t mobile/android/app/build/outputs/apk/debug/app-debug.apk > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: android-qa-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Attach Android bundle to public release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" mobile/android/app/build/outputs/bundle/release/*.aab --clobber
  publish-preview:
    if: github.event_name == 'push'
    needs: [ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: '*unsigned*'
          path: mobile/build/release
          merge-multiple: true
      - name: Verify the exact installable APK and publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('mobile/distribution/latest.json','utf8'));
          if(!/^\d+\.\d+\.\d+$/.test(r.version)||!/^\/downloads\/[A-Za-z0-9_.-]+\.apk$/.test(r.download)||!/^[a-f0-9]{64}$/.test(r.sha256))throw Error('Invalid release manifest');
          fs.writeFileSync('mobile/build/release/SHA256SUMS.txt',r.sha256+'  '+r.download.split('/').pop()+'\n');
          fs.appendFileSync(process.env.GITHUB_ENV,'RELEASE_TAG=v'+r.version+'\nAPK_NAME='+r.download.split('/').pop()+'\nAPK_URL=https://gochopam.pages.dev'+r.download+'\n');
          JS
      - name: Download and verify installable APK
        run: |
          curl --fail --location --retry 2 --max-time 90 "$APK_URL" -o "mobile/build/release/$APK_NAME"
          cd mobile/build/release
          sha256sum --check SHA256SUMS.txt
      - name: Publish Android and iOS files with author information
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Version already released; leaving its assets unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease --title "Góc Hợp Âm 1.3.0 · NPT Duy" --notes-file mobile/distribution/NOTES.md
          gh release upload "$RELEASE_TAG" mobile/build/release/* --clobber
