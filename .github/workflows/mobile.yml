name: Build Android and iOS
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared UI
        run: |
          node mobile/scripts/prepare-web.mjs
          node --check public/mobile/bundle.js
          node --test tests/mobile.test.mjs
      - name: Build iOS Simulator
        run: |
          xcodebuild -project mobile/ios/GocHopAm.xcodeproj -scheme GocHopAm -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath mobile/build/ios-simulator CODE_SIGNING_ALLOWED=NO build
          mkdir -p mobile/build/release
          ditto -c -k --sequesterRsrc --keepParent mobile/build/ios-simulator/Build/Products/Debug-iphonesimulator/GocHopAm.app mobile/build/release/Goc_Hop_Am_iOS_Simulator.zip
      - name: Build iOS device without signing
        run: |
          xcodebuild -project mobile/ios/GocHopAm.xcodeproj -scheme GocHopAm -configuration Release -destination 'generic/platform=iOS' -derivedDataPath mobile/build/ios-device CODE_SIGNING_ALLOWED=NO build
          mkdir -p mobile/build/Payload
          cp -R mobile/build/ios-device/Build/Products/Release-iphoneos/GocHopAm.app mobile/build/Payload/
          cd mobile/build
          zip -qry release/Goc_Hop_Am_iOS_Chua_Ky.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-and-simulator
          path: mobile/build/release/*
          retention-days: 14
      - name: Attach iOS files to public release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" mobile/build/release/* --clobber
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned Android App Bundle
        run: |
          node mobile/scripts/prepare-web.mjs
          gradle -p mobile/android :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
      - name: Attach Android bundle to public release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" mobile/android/app/build/outputs/bundle/release/*.aab --clobber
