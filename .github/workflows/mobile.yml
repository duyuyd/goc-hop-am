name: Build Android and iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared UI
        run: |
          node mobile/scripts/prepare-web.mjs
          node --check public/mobile/bundle.js
          npm test
      - name: Build iOS Simulator
        run: |
          xcodebuild -project mobile/ios/GocHopAm.xcodeproj -scheme GocHopAm -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath mobile/build/ios-simulator CODE_SIGNING_ALLOWED=NO build
          mkdir -p mobile/build/release
          ditto -c -k --sequesterRsrc --keepParent mobile/build/ios-simulator/Build/Products/Debug-iphonesimulator/GocHopAm.app mobile/build/release/Goc_Hop_Am_iOS_Simulator.zip
      - name: Build iOS device without signing
        run: |
          xcodebuild -project mobile/ios/GocHopAm.xcodeproj -scheme GocHopAm -configuration Release -destination 'generic/platform=iOS' -derivedDataPath mobile/build/ios-device CODE_SIGNING_ALLOWED=NO build
          mkdir -p mobile/build/Payload
          cp -R mobile/build/ios-device/Build/Products/Release-iphoneos/GocHopAm.app mobile/build/Payload/
          cd mobile/build
          zip -qry release/Goc_Hop_Am_iOS_Chua_Ky.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-and-simulator
          path: mobile/build/release/*
          retention-days: 14
      - name: Attach iOS files to public release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" mobile/build/release/* --clobber
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate free AI sheet queue (no model download)
        run: python3 -m unittest discover -s tests -p test_ai_sheet.py -v
      - name: Build unsigned Android App Bundle
        run: |
          node mobile/scripts/prepare-web.mjs
          gradle -p mobile/android :app:assembleDebug :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
      - name: Verify standalone QA APK archive
        run: |
          test -s mobile/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t mobile/android/app/build/outputs/apk/debug/app-debug.apk > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: android-qa-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Attach Android bundle to public release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" mobile/android/app/build/outputs/bundle/release/*.aab --clobber
  publish-preview:
    if: github.event_name == 'push'
    needs: [ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-qa-debug-apk
          path: qa-release
      - name: Verify exact QA APK and publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test -s qa-release/app-debug.apk
          unzip -t qa-release/app-debug.apk > /dev/null
          mv qa-release/app-debug.apk qa-release/Goc_Hop_Am_Android_1.3.1_QA.apk
          (cd qa-release && sha256sum Goc_Hop_Am_Android_1.3.1_QA.apk > SHA256SUMS.txt)
          tag=v1.3.1-qa
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "QA version already published. Keep the exact existing signing identity and release assets unchanged."
            exit 0
          fi
          gh release create "$tag" qa-release/Goc_Hop_Am_Android_1.3.1_QA.apk qa-release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Góc Hợp Âm Android 1.3.1 QA · Tìm kiếm Sites" \
            --notes "Bản thử nghiệm Android cài song song với 1.3.0, không ghi đè dữ liệu cũ. Ưu tiên Sites goc-hop-am.onwardcrust.chatgpt.site, loại bỏ API máy chủ cũ, thêm duyệt kho bài Sites trong ứng dụng khi API không sẵn sàng. Bản debug QA chưa được kiểm thử trên điện thoại thực tế; không dùng để cập nhật bản 1.3.0 hiện có."
