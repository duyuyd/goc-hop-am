name: Build Android and iOS
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared UI
        run: |
          node mobile/scripts/prepare-web.mjs
          node --check public/mobile/bundle.js
          node --test tests/mobile.test.mjs tests/video-captions.test.mjs tests/music-tools.test.mjs tests/lyric-follow.test.mjs
      - name: Build iOS Simulator
        run: |
          xcodebuild -project mobile/ios/GocHopAm.xcodeproj -scheme GocHopAm -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath mobile/build/ios-simulator CODE_SIGNING_ALLOWED=NO build
          mkdir -p mobile/build/release
          ditto -c -k --sequesterRsrc --keepParent mobile/build/ios-simulator/Build/Products/Debug-iphonesimulator/GocHopAm.app mobile/build/release/Goc_Hop_Am_iOS_Simulator.zip
      - name: Build iOS device without signing
        run: |
          xcodebuild -project mobile/ios/GocHopAm.xcodeproj -scheme GocHopAm -configuration Release -destination 'generic/platform=iOS' -derivedDataPath mobile/build/ios-device CODE_SIGNING_ALLOWED=NO build
          mkdir -p mobile/build/Payload
          cp -R mobile/build/ios-device/Build/Products/Release-iphoneos/GocHopAm.app mobile/build/Payload/
          cd mobile/build
          zip -qry release/Goc_Hop_Am_iOS_Chua_Ky.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-and-simulator
          path: mobile/build/release/*
          retention-days: 14
      - name: Attach iOS files to public release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" mobile/build/release/* --clobber
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned Android App Bundle
        run: |
          node mobile/scripts/prepare-web.mjs
          gradle -p mobile/android :app:assembleDebug :app:bundleRelease --no-daemon
          test -s mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: android-installable-preview-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Attach Android bundle to public release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" mobile/android/app/build/outputs/bundle/release/*.aab --clobber
  publish-preview:
    if: github.event_name == 'push'
    needs: [ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: mobile/build/release
          merge-multiple: true
      - name: Verify the freshly built installable Android APK
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('node:fs'),path=require('node:path');
          const gradle=fs.readFileSync('mobile/android/app/build.gradle','utf8');
          const version=gradle.match(/versionName '([0-9]+\\.[0-9]+\\.[0-9]+)'/);
          const file='mobile/build/release/app-debug.apk';
          if(!version||!fs.existsSync(file)||fs.statSync(file).size<100000)throw Error('Fresh APK artifact missing or version unknown');
          const out='Goc_Hop_Am_Android_'+version[1]+'_Preview.apk';
          fs.renameSync(file,path.join('mobile/build/release',out));
          fs.appendFileSync(process.env.GITHUB_ENV,'RELEASE_TAG=v'+version[1]+'\\nAPP_VERSION='+version[1]+'\\nAPK_NAME='+out+'\\n');
          JS
          cd mobile/build/release
          unzip -t "$APK_NAME" >/dev/null
          sha256sum "$APK_NAME" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Release the freshly built APK and other mobile artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" mobile/build/release/* --clobber
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease --title "Góc Hợp Âm $APP_VERSION · NPT Duy" --notes-file mobile/distribution/NOTES.md
            gh release upload "$RELEASE_TAG" mobile/build/release/* --clobber
          fi
