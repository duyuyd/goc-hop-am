name: Verify security fixes with CodeQL
on:
  push:
    branches:
      - security/alerts-triage-2026-11-10
    paths:
      - .github/workflows/security-codeql-verify.yml
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  codeql-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, java-kotlin]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: security-review-${{ matrix.language }}
  codeql-swift:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          queries: security-extended
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: security-review-swift
