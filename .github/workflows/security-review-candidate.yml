name: Security review candidate (one-time)
on:
  push:
    branches:
      - security/alerts-triage-2026-11-10
    paths:
      - .github/workflows/security-review-candidate.yml
permissions:
  contents: read
jobs:
  patch-moderate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/alerts-triage-2026-11-10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply scoped dependency overrides
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path='package.json';
          const pkg=JSON.parse(fs.readFileSync(path,'utf8'));
          pkg.overrides ??= {};
          pkg.overrides['esbuild']='0.28.2';
          pkg.overrides['@typescript-eslint/typescript-estree']={minimatch:'11.0.1'};
          fs.writeFileSync(path,JSON.stringify(pkg,null,2)+'\n');
          JS
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify audit has no remaining npm vulnerabilities
        run: |
          npm audit --json > candidate-audit.json || true
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('candidate-audit.json','utf8'));
          const counts=a.metadata?.vulnerabilities;
          if(!counts) throw Error('npm audit unavailable');
          console.log(JSON.stringify(counts,null,2));
          if(counts.total>0) {
            console.log('Vulnerable packages:',Object.keys(a.vulnerabilities || {}).join(', '));
            throw Error('Dependency vulnerabilities remain: no commit made');
          }
          JS
      - name: Verify shared mobile bundle
        run: |
          node mobile/scripts/prepare-web.mjs
          node --check public/mobile/bundle.js
      - name: Lint code
        run: npm run lint
      - name: Test complete suite
        run: node --test tests/*.test.mjs
      - name: Verify migration tool starts
        run: ./node_modules/.bin/drizzle-kit --help
      - name: Build website
        run: npm run build
      - name: Commit tested fix to current PR branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "fix(security): resolve remaining npm audit advisories [skip ci]"
          git push origin HEAD:security/alerts-triage-2026-11-10
  investigate-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Query GitHub security alert summaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          gh api -H 'Accept: application/vnd.github+json' "/repos/$GH_REPO/code-scanning/alerts?state=open&per_page=100" > code-alerts.json
          code_status=$?
          gh api -H 'Accept: application/vnd.github+json' "/repos/$GH_REPO/dependabot/alerts?state=open&per_page=100" > dependabot-alerts.json
          dep_status=$?
          echo "Code scanning query status: $code_status"
          echo "Dependabot query status: $dep_status"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          function load(name) {try {const j=JSON.parse(fs.readFileSync(name,'utf8'));return Array.isArray(j)?j:[]}catch{return []}}
          const code=load('code-alerts.json'), dependabot=load('dependabot-alerts.json');
          const summary={
            codeScanning:code.map(a=>({number:a.number,rule:a.rule?.id,severity:a.rule?.security_severity_level||a.rule?.severity,path:a.most_recent_instance?.location?.path,line:a.most_recent_instance?.location?.start_line})),
            dependabot:dependabot.map(a=>({number:a.number,severity:a.security_advisory?.severity,package:a.dependency?.package?.name,manifest:a.dependency?.manifest_path,patched:a.security_vulnerability?.first_patched_version?.identifier}))
          };
          console.log(JSON.stringify(summary,null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Alert inventory\n\nCode scanning: '+code.length+' entries returned; Dependabot: '+dependabot.length+' entries returned. Missing entries may be due to permission errors shown in logs.\n');
          JS
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build Android debug (no publication)
        run: |
          node mobile/scripts/prepare-web.mjs
          gradle -p mobile/android :app:assembleDebug --no-daemon
  build-ios:
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build iOS Simulator without signing or publishing
        run: |
          node mobile/scripts/prepare-web.mjs
          xcodebuild -project mobile/ios/GocHopAm.xcodeproj -scheme GocHopAm -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath mobile/build/security-review CODE_SIGNING_ALLOWED=NO build
