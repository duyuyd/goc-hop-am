name: Goc Hop Am - zero trust atomic verification
on:
  push:
    branches:
      - release/goc-hop-am-v13.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goc-hop-am-atomic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-regression:
    name: Read-only source and imported-song regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify imports and source reader behavior
        run: |
          node tests/imported-song-logic.test.mjs
          node tests/catalog.test.mjs
          node tests/reader.test.mjs

  atomic-verification:
    name: Remote D1 and real production Playwright proof
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      PRODUCTION_URL: ${{ vars.VERCEL_PRODUCTION_URL }}
      E2E_WEBHOOK_URL: ${{ secrets.E2E_WEBHOOK_URL }}
      CRAWL_SEED_URL: ${{ vars.CRAWL_SEED_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require genuine remote services and credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'FAIL: CLOUDFLARE_API_TOKEN missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'FAIL: CLOUDFLARE_ACCOUNT_ID missing'; exit 1; }
          test -n "$D1_DATABASE_NAME" || { echo 'FAIL: D1_DATABASE_NAME variable missing'; exit 1; }
          test -n "$PRODUCTION_URL" || { echo 'FAIL: VERCEL_PRODUCTION_URL variable missing'; exit 1; }
          test -n "$E2E_WEBHOOK_URL" || { echo 'FAIL: E2E_WEBHOOK_URL secret missing'; exit 1; }
          [[ "$PRODUCTION_URL" == https://* ]] || { echo 'FAIL: production must be HTTPS'; exit 1; }
          [[ "$E2E_WEBHOOK_URL" == https://* ]] || { echo 'FAIL: webhook must be HTTPS'; exit 1; }
          echo 'Remote configuration present; no values fabricated.'

      - name: Install project and Playwright
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
          python -m pip install underthesea

      - name: Start source provenance window
        run: echo "CI_STARTED_AT=$(date -u +%s%3N)" >> "$GITHUB_ENV"

      - name: Crawl original source HTML in a clean browser
        run: node --experimental-strip-types scripts/crawler.ts

      - name: Validate Vietnamese text and source identity
        run: python scripts/validate_vi.py

      - name: Generate actual remote D1 SQL and checksums
        run: |
          node --experimental-strip-types scripts/make-import-sql.ts
          sha256sum artifacts/songs_import.json songs_import.sql

      - name: Import verified rows to remote D1
        run: npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --file=./songs_import.sql

      - name: Print remote database counts (real CLI stdout)
        run: |
          npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --command "SELECT count(*) AS total, count(distinct artist) AS distinct_artists, count(distinct title) AS distinct_titles FROM songs;"
          npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --command "SELECT count(distinct slug) AS distinct_slugs FROM songs;"

      - name: Seed dynamic OTP in this CI run
        run: node --experimental-strip-types scripts/e2e-seed.ts

      - name: Write dynamic OTP to remote D1
        run: npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --file=./artifacts/e2e-seed.sql

      - name: Verify live production using browser only
        run: npx playwright test tests/e2e/goc-hop-am.spec.ts --reporter=line

      - name: Archive actual evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goc-hop-am-atomic-verification
          path: |
            artifacts/
            songs_import.sql
            test-results/
          if-no-files-found: warn
          retention-days: 7
